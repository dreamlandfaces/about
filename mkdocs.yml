site_name: Dreamland Faces
copyright : "2023"
theme: 
      name: material
      font:
            text: Josefin Slab
      icon:
            :musical_score:
      palette:
            primary: white
            accent: green
      
      features:
            - navigation.instant
            - content.tooltips
            - navigation.tabs
            - navigation.tabs.sticky
            - navigation.top
      logo: images/logo2.png
      icon:
            repo: fontawesome/brands/github

plugins:
      - privacy
      - mkdocs-video
      
extra:
      generator: false

extra_css:
      - stylesheets/extra.css

markdown_extensions:
      - abbr
      - tables
      - attr_list
      - md_in_html
      - def_list
      - admonition

nav:
- About: 'index.md'
- Music: 'music.md'
- Video: 'video.md'
- Silent films: 'silentFilms.md'



